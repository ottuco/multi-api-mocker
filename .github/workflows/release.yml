# Builds the wheel when a v* tag is pushed and uploads it to PyPI.
#
# The build job has no credentials. The publish job runs in the `pypi` GitHub
# environment and is the only one that can publish (#161538). Only tags that
# point at a commit on main are published.
#
# Publishing mode is chosen by the repository variable PYPI_TRUSTED_PUBLISHING:
#   unset or not "true": legacy, uploads with the PYPI_API_TOKEN secret (as before).
#   "true": PyPI Trusted Publishing (OIDC), no token. Switch on only after the
#           trusted publisher exists on PyPI (see the PR description).

name: Release Workflow

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Check out the tag
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Only publish tags that point at a commit on main
      run: |
        git fetch --no-tags origin main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Tag $GITHUB_REF_NAME is not on main; refusing to publish."
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel

    - name: Build the wheel
      run: |
        python setup.py sdist bdist_wheel

    - name: Keep the wheel
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/*.whl
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/multi-api-mocker/
    permissions:
      id-token: write  # Trusted Publishing only; never used in legacy mode
    steps:
    - name: Get the wheel
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/

    - name: Publish package (trusted publishing)
      if: ${{ vars.PYPI_TRUSTED_PUBLISHING == 'true' }}
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

    - name: Publish package (legacy token, remove after the switch)
      if: ${{ vars.PYPI_TRUSTED_PUBLISHING != 'true' }}
      uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
