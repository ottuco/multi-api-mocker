name: Validation Workflow

on:
  pull_request:
    # Drafts are skipped (job-level `if` below); ready_for_review runs the checks
    # when the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python${{ matrix.python-version }} -m pip install --upgrade pip
          python${{ matrix.python-version }} -m pip install -r requirements_dev.txt

      - name: Check code formatting with Black
        run: |
          black --check .

      - name: Lint with flake8
        run: |
          flake8 .

      - name: Run tests with specified Python version
        run: |
          python${{ matrix.python-version }} -m pytest
