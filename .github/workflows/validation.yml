name: Validation Workflow

on:
  pull_request:
    # Drafts are skipped (job-level `if` below); ready_for_review runs the checks
    # when the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

jobs:
  validation:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python${{ matrix.python-version }} -m pip install --upgrade pip
          python${{ matrix.python-version }} -m pip install -r requirements_dev.txt

      - name: Check code formatting with Black
        run: |
          black --check .

      - name: Lint with flake8
        run: |
          flake8 .

      - name: Run tests with specified Python version
        run: |
          python${{ matrix.python-version }} -m pytest
